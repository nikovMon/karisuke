# Merge this scrape_config into Prometheus 2.36.1 prometheus.yml.
# Replace YOUR_OPENSHIFT_PROJECT before applying it.

scrape_configs:
  - job_name: findair
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s

    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - YOUR_OPENSHIFT_PROJECT

    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"

      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
        action: keep
        regex: findair

      - source_labels: [__meta_kubernetes_pod_phase]
        action: keep
        regex: Running

      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: "(.+)"

      - source_labels:
          - __address__
          - __meta_kubernetes_pod_annotation_prometheus_io_port
        action: replace
        regex: "([^:]+)(?::\\d+)?;(\\d+)"
        replacement: "$1:$2"
        target_label: __address__

      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: k8s_namespace_name

      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: k8s_pod_name

      - source_labels: [__meta_kubernetes_pod_uid]
        action: replace
        target_label: k8s_pod_uid

      - source_labels: [__meta_kubernetes_node_name]
        action: replace
        target_label: k8s_node_name

      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: replace
        target_label: service_name

      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
        action: replace
        target_label: service_version

      - source_labels: [__meta_kubernetes_pod_label_environment]
        action: replace
        target_label: deployment_environment

      - action: replace
        replacement: findair
        target_label: service_namespace
