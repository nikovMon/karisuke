# Logstash 8.5.3: unified-gateway ECS JSON batches from production.
input {
  http {
    id => "unified_gateway_production_http"
    host => "0.0.0.0"
    port => 8083
    codec => json

    # Keep HTTP transport metadata out of application ECS fields.
    ecs_compatibility => "disabled"
    request_headers_target_field => "[@metadata][input][http][request][headers]"
    remote_host_target_field => "[@metadata][input][http][remote_host]"
    response_code => 202
  }
}

filter {
  # Logstash is authoritative for routing, regardless of application fields.
  mutate {
    replace => {
      "[event][dataset]" => "unified_gateway"
      "[data_stream][type]" => "logs"
      "[data_stream][dataset]" => "unified_gateway"
      "[data_stream][namespace]" => "production"
    }
    remove_field => ["@version"]
  }

  if "_jsonparsefailure" in [tags] {
    mutate {
      add_field => {
        "[error][type]" => "logstash.json_parse_failure"
        "[error][message]" => "Logstash received a body that was not valid JSON."
        "[event][outcome]" => "failure"
      }
    }
  }
}

output {
  elasticsearch {
    id => "unified_gateway_production_elasticsearch"
    hosts => ["${FINDAIR_LOGS_ELASTICSEARCH_HOST}"]
    user => "${FINDAIR_LOGS_ELASTICSEARCH_USER}"
    password => "${FINDAIR_LOGS_ELASTICSEARCH_PASSWORD}"
    ssl => true
    ssl_certificate_verification => true
    cacert => "${FINDAIR_LOGS_ELASTICSEARCH_CA}"
    http_compression => true
    ecs_compatibility => "v8"
    manage_template => false
    ilm_enabled => false

    data_stream => "true"
    data_stream_auto_routing => false
    data_stream_sync_fields => true
    data_stream_type => "logs"
    data_stream_dataset => "unified_gateway"
    data_stream_namespace => "production"
  }
}
